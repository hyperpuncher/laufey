name: Build pi-ui CEF backends

on:
  push:
    branches: [build/pi-ui-cef]
    tags: ["cef-*"]

jobs:
  build:
    name: CEF / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libx11-dev libxi-dev libglib2.0-dev libnss3-dev libnspr4-dev \
            libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdrm-dev \
            libgtk-3-dev libgbm-dev libasound2-dev libpango1.0-dev \
            libcairo2-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libxkbcommon-dev libdbus-1-dev libxext-dev libxfixes-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install llvm ninja

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install make ninja -y

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: vendor/cef
          key: pi-ui-cef-150.0.11-${{ matrix.os }}-${{ runner.arch }}

      - name: Build CEF backend
        run: make cef

      - name: Verify Chromium version
        if: runner.os == 'Linux'
        run: |
          strings cef/build/Release/libcef.so \
            | grep -m1 'Chrome/150\.0\.7871\.115'

      - name: Package backend
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            tar czf laufey-cef-${{ matrix.target }}.tar.gz \
              -C cef/build/Release laufey.app
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cd cef/build/Release
            7z a ../../../laufey-cef-${{ matrix.target }}.zip '*'
          else
            strip --strip-unneeded \
              cef/build/Release/laufey \
              cef/build/Release/chrome-sandbox \
              cef/build/Release/libcef.so \
              cef/build/Release/libEGL.so \
              cef/build/Release/libGLESv2.so \
              cef/build/Release/libvk_swiftshader.so \
              cef/build/Release/libvulkan.so.1
            tar czf laufey-cef-${{ matrix.target }}.tar.gz \
              -C cef/build/Release .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: laufey-cef-${{ matrix.target }}
          path: laufey-cef-${{ matrix.target }}.*

  release:
    name: Publish CEF backends
    if: startsWith(github.ref, 'refs/tags/cef-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum laufey-cef-* > SHA256SUMS

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: artifacts/*
          body: |
            Laufey 0.5.1 (API 29) CEF backends for pi-ui.

            Built against CEF 150.0.11+gb887805+chromium-150.0.7871.115.
